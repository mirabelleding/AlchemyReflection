[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "AlchemyReflection"
version = "0.1.1"
description = "An object-oriented interface for SQLAlchemy, built around method chaining and pandas/Polars interoperability."
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "MI77-LAB" }
]

dependencies = [
    "sqlalchemy>=2.0",
    "pandas>=2.0",
    "polars>=1.0",
    "pyodbc>=5.0",
]

[project.urls]
Repository = "https://github.com/mirabelleding/AlchemyReflection"

[tool.setuptools.packages.find]
where = ["alchemy_reflection"]